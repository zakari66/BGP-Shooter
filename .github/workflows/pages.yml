name: Deploy to GitHub Pages

# Publishes the static BGP-Shooter site (vanilla HTML/CSS/JS, no build step) to
# GitHub Pages on every push to main. Also runnable on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Upload the repo root: index.html + styles/ + src/ are served as-is.
      # No node_modules exists on the runner (no install step), so nothing extra ships.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
